<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saints &amp; Spells: Sicily's saints, relics and magic, checked</title>
<meta name="description" content="A show in eight acts about Sicilian Catholicism, folk magic and the 'goddess under the saint' story, checked claim by claim. By Bryan Murphy.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
[hidden] { display:none !important; }   /* .zoom, .cabpop and .glosspop set display; without this, hidden ones show on the live page */
/* Layout: a sticky cut-paper puppet stage (top of the screen on phones, left half on desktop) with the essay's
   plaster cards scrolling beside or under it. Single look: light tile ground, two night acts. */
:root {
  --tile:#efe4c8; --plaster:#fcf9f2; --ink:#2a1d16; --ink-soft:#5f4b3e; --blue:#1d4f8a; --red:#a3171f; --gold:#e3a82f;
  --night:#1c1020; --night2:#3a1416; --candle:#f4d27c; --night-ink:#f3e8d8; --night-soft:#cdb9a3; --night-card:#241519;
  --display:"Gloock", "Bodoni 72", Didot, Georgia, serif; --body:"Literata", Georgia, "Times New Roman", serif;
  color-scheme:light;
}
* { box-sizing:border-box; }
html { scroll-behavior:smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior:auto; } }
body { margin:0; background:var(--tile); color:var(--ink); font:18px/1.6 var(--body); -webkit-text-size-adjust:100%; }
.vh { position:absolute !important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.skip { position:absolute; left:8px; top:-60px; background:var(--ink); color:var(--plaster); padding:8px 12px; z-index:50; }
.skip:focus { top:8px; }

.show { display:grid; grid-template-columns:1fr; }
.stagewrap { position:sticky; top:0; z-index:5; height:min(42svh, 118vw); min-height:250px; background:var(--tile); }
.stage { position:absolute; inset:0; }
.stage canvas { display:block; width:100%; height:100%; }
.stagebar { position:absolute; left:0; right:0; bottom:0; display:flex; justify-content:space-between; align-items:end; gap:8px;
  padding:0 max(10px, env(safe-area-inset-right, 0px)) 4px max(10px, env(safe-area-inset-left, 0px)); pointer-events:none; }
.oncap { font:600 11px/1.3 var(--body); letter-spacing:.04em; color:var(--plaster); background:rgba(42,29,22,.82); padding:3px 7px; border-radius:2px; max-width:70%; pointer-events:auto; }
.oncap:empty { display:none; }
.cabbtn { pointer-events:auto; margin-left:auto; min-width:44px; min-height:44px; font:600 12px/1.2 var(--body); background:#d8b45a; color:var(--ink);
  border:3px solid #f7f0e0; border-radius:22px 22px 4px 4px; padding:6px 10px; box-shadow:3px 4px 0 rgba(30,12,0,.3); cursor:pointer;
  transition:transform .25s ease, background-color .25s ease; }
.cabbtn.bump { transform:scale(1.08); background:var(--gold); }
.cabbtn:focus-visible, .cabclose:focus-visible, .cabthumb:focus-visible, .gloss:focus-visible, a:focus-visible, summary:focus-visible { outline:3px solid var(--blue); outline-offset:2px; }
.cabpop { position:fixed; left:12px; right:12px; bottom:12px; max-height:min(74svh, 580px); overflow-y:auto;
  background:var(--plaster); color:var(--ink); border:2px solid var(--ink); border-radius:4px;
  padding:12px 14px; font-size:14px; line-height:1.45; box-shadow:0 12px 32px rgba(0,0,0,.45); z-index:45; }
.cabpop-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:0 0 6px; }
.cabpop .cabh { font:400 19px/1.2 var(--display); margin:0; }
.cabclose { width:34px; height:34px; border:1.5px solid var(--ink); border-radius:50%; background:var(--plaster);
  color:var(--ink); font:22px/1 Georgia, serif; cursor:pointer; flex:0 0 auto; }
.cabclose:hover { background:var(--gold); }
.cabpop ol { margin:0; padding:0; list-style:none; display:grid; gap:10px; }
.cabpop li.cabitem { display:grid; grid-template-columns:64px minmax(0,1fr); gap:10px; align-items:start;
  padding:8px; background:#f6ecdc; border:1px solid rgba(42,29,22,.2); border-radius:3px; }
.cabpop li.cabempty { padding:8px 0; color:var(--ink-soft); }
.cabthumb { display:block; width:64px; height:64px; padding:0; border:2px solid #d8b45a; border-radius:3px;
  overflow:hidden; background:#2a1d16; cursor:zoom-in; flex:0 0 auto; }
.cabthumb img { display:block; width:100%; height:100%; object-fit:cover; }
.cabpop .cabtxt b { display:block; margin-bottom:2px; }
.cabpop .cabzoomhint { display:block; margin-top:4px; font-size:12px; color:var(--blue); }
.cabpop .cabi { margin:0 0 10px; font-size:13.5px; color:var(--ink-soft); }
.cabpop p#cabnote { margin:10px 0 0; font-size:13px; color:var(--ink-soft); }
@media (min-width: 900px) {
  .cabpop { left:auto; right:calc(50vw + 14px); bottom:58px; width:min(410px, calc(50vw - 28px)); max-height:min(76vh, 620px); }
}

main.text { padding-bottom:40px; min-width:0; }
.sec { padding:22px max(14px, env(safe-area-inset-right, 0px)) 26px max(14px, env(safe-area-inset-left, 0px)); }
.sec.night { background:linear-gradient(var(--night), var(--night2)); color:var(--night-ink); }
.card { background:var(--plaster); padding:22px 20px 22px; border-radius:3px; max-width:640px; margin:0 auto;
  box-shadow:0 6px 0 rgba(42,29,22,.12), 0 0 0 5px var(--plaster), 0 8px 16px rgba(42,29,22,.25); position:relative; }
.night .card { background:var(--night-card); color:var(--night-ink); box-shadow:0 0 0 5px var(--night-card), 0 8px 16px rgba(0,0,0,.5); }
.kicker { font:600 12px/1.2 var(--body); letter-spacing:.14em; text-transform:uppercase; color:var(--blue); margin:0; }
.night .kicker { color:var(--candle); }
h1, h2 { font:400 34px/1.08 var(--display); margin:6px 0 14px; text-wrap:balance; }
h1 { font-size:44px; }
h3 { font:400 23px/1.2 var(--display); margin:26px 0 8px; text-wrap:balance; }
h4, .dgroup h3 { font:600 14px/1.3 var(--body); margin:0 0 6px; letter-spacing:.02em; }
p { margin:0 0 14px; }
.card ul { margin:0 0 14px; padding-left:22px; }
.card li { margin-bottom:6px; }
strong { font-weight:600; }
a { color:var(--blue); }
.night a { color:#9cc3f2; }
.dek { font-size:19px; }
.byline { font-size:14px; color:var(--ink-soft); }
.acts { display:flex; flex-wrap:wrap; gap:6px; margin:14px 0 8px; padding:0; list-style:none; }
.acts a { display:inline-block; font-size:13px; padding:5px 9px; border:1.5px solid var(--ink); border-radius:2px; background:#fff; color:var(--ink); text-decoration:none; }
.acts a:hover { background:var(--gold); }
.hero .ribbon { text-align:center; max-width:640px; margin:0 auto 14px; }
.hero .ribbon h1 { display:inline-block; margin:0; background:#f6e7c3; color:#7d1a1f; padding:10px 40px 8px;
  clip-path:polygon(0 50%, 26px 0, calc(100% - 26px) 0, 100% 50%, calc(100% - 26px) 100%, 26px 100%); }
.herotitle { font:400 38px/1.05 var(--display); color:#7d1a1f; margin:6px 0 12px; }
.amp { font-style:italic; }
.howto { font-size:14px; color:var(--ink-soft); margin:10px 0 0; }

.gloss { font:inherit; font-style:italic; color:var(--blue); background:none; border:0; padding:0; cursor:pointer;
  text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:3px; }
.night .gloss { color:#9cc3f2; }
.glosspop { position:absolute; z-index:20; max-width:min(340px, calc(100vw - 24px)); background:var(--plaster); color:var(--ink); border:2px solid var(--blue);
  padding:10px 12px; font-size:15px; line-height:1.45; box-shadow:0 8px 20px rgba(0,0,0,.45); border-radius:3px; }
.artpop { position:fixed; z-index:30; pointer-events:none; }
.infig { margin:1.4em 0; }
.figbtn { display:block; padding:0; border:0; background:none; cursor:zoom-in; width:100%; }
.infig img { display:block; width:100%; height:auto; border:6px solid #fbf6ea; box-shadow:0 2px 0 rgba(42,29,22,.25), 0 6px 18px rgba(42,29,22,.18); }
.figbtn:focus-visible { outline:3px solid currentColor; outline-offset:3px; }
.infig figcaption { font-size:.9em; line-height:1.45; margin-top:.6em; }
.infig .credit { display:block; opacity:.8; font-size:.92em; margin-top:.25em; }
@media print { .infig img { max-width:60%; } }
.zbtn { font:inherit; color:inherit; background:none; border:0; padding:0; text-decoration:underline dotted; text-underline-offset:2px; cursor:zoom-in; }
.zoom { position:fixed; inset:0; z-index:60; background:rgba(22,10,8,.9); display:flex; align-items:center; justify-content:center;
  padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.zoom figure { margin:0; max-width:min(100%, 1200px); max-height:100%; overflow:auto; display:flex; flex-direction:column; gap:10px; }
.zoom img { display:block; max-width:100%; max-height:78vh; object-fit:contain; margin:0 auto; cursor:zoom-in; background:#fff; }
.zoom.big img { max-height:none; max-width:none; width:min(1400px, 220vw); cursor:zoom-out; }
.zoom figcaption { color:#f3ead6; font:14px/1.45 var(--body); max-width:70ch; }
.zoom figcaption a { color:#f6c66b; }
.zclose { position:fixed; top:max(10px, env(safe-area-inset-top, 0px)); right:max(12px, env(safe-area-inset-right, 0px)); z-index:61; font:28px/1 Georgia, serif;
  width:44px; height:44px; border-radius:50%; border:2px solid #f3ead6; background:#2a1d16; color:#f3ead6; cursor:pointer; }
.glosspop b { color:var(--blue); font-style:italic; font-weight:600; }
.gloss.callout { font-style:normal; text-decoration-style:dotted; }
.gloss.callout strong { color:var(--blue); }
.glosspop.co { max-width:min(420px, calc(100vw - 24px)); font-size:14.5px; }
.glosspop.co::after { content:""; display:block; clear:both; }
.glosspop.co .ct { font-style:normal; font-size:16px; }
.glosspop.co .cs { color:var(--ink-soft); }
.glosspop.co .cx { display:block; margin-top:4px; }
.glosspop .por { float:left; width:84px; height:auto; margin:2px 12px 6px 0; border:2px solid var(--ink); filter:sepia(.25); }
.glosspop .cc { display:block; clear:both; padding-top:6px; font-size:12px; color:var(--ink-soft); }

.myth { display:grid; grid-template-columns:auto minmax(0,1fr); gap:14px; align-items:center; margin:16px 0; padding:12px; background:#f6ecdc; border-radius:2px; }
.night .myth { background:#33202a; }
.myth p { margin:0; font-size:15px; line-height:1.45; }
.myth .claim { font-style:italic; }
.myth .verdict { display:block; margin-top:3px; font-weight:600; }
.stampbox { display:inline-block; border:3px solid var(--red); color:var(--red); padding:6px 10px 5px; font:400 15px/1.25 var(--display);
  letter-spacing:.06em; text-transform:uppercase; transform:rotate(-3deg); background:rgba(255,255,255,.55); white-space:nowrap; }
.night .stampbox { color:#ff9a8a; border-color:#ff9a8a; background:rgba(0,0,0,.2); }

.myth-sm { display:flex; flex-wrap:wrap; gap:6px 10px; align-items:baseline; margin:14px 0; padding:10px 12px; background:#f6ecdc;
  border-left:3px solid #9d8b74; border-radius:2px; transition:border-color .35s ease, background-color .35s ease; }
.night .myth-sm { background:#33202a; border-left-color:#8d786a; }
.myth-sm p { margin:0; font-size:14.5px; line-height:1.45; flex:1 1 240px; }
.myth-sm .mtag { font:600 11px/1.2 var(--body); letter-spacing:.08em; text-transform:uppercase; padding:2px 6px; border-radius:2px;
  border:1.5px solid #8a7862; color:var(--ink-soft); background:rgba(255,255,255,.45); white-space:nowrap;
  transition:color .35s ease, border-color .35s ease, background-color .35s ease; }
.night .myth-sm .mtag { border-color:#8d786a; color:var(--night-soft); background:rgba(0,0,0,.2); }
.myth-sm .mclaim { font-style:italic; }
.myth-sm .mclaim::after { content:" — "; font-style:normal; }
.myth-sm .mverd { font-weight:600; }
.myth-sm.lit { border-left-color:var(--red); }
.myth-sm.lit .mtag { border-color:var(--red); color:var(--red); background:rgba(255,255,255,.75); }
.night .myth-sm.lit { border-left-color:#ff9a8a; }
.night .myth-sm.lit .mtag { border-color:#ff9a8a; color:#ff9a8a; background:rgba(0,0,0,.35); }

figure.chart { margin:18px 0; }
figcaption { font-size:14px; line-height:1.45; color:var(--ink-soft); margin-top:8px; }
.night figcaption { color:var(--night-soft); }
details.aslist { margin:-6px 0 16px; font-size:15px; }
details.aslist summary { cursor:pointer; color:var(--blue); font-weight:600; min-height:32px; }
.tl, .strip { width:100%; height:auto; display:block; font-family:var(--body); }
.tl .yr, .strip .yr { font-size:11px; fill:var(--ink-soft); }
.tl .axis, .strip .axis { stroke:var(--ink); stroke-width:1.5; }
.tl .tick, .strip .tick { stroke:var(--ink-soft); }
.tl .lead, .strip .lead { stroke:#b7a48c; stroke-width:1; }
.tl .lab, .strip .lab { font-size:12px; fill:var(--ink); }
.tl .lyr, .strip .lyr { font-weight:600; }
.tl .span { fill:var(--gold); stroke:var(--ink); stroke-width:1; }
.tl .pt, .strip .pt { fill:var(--ink); }
.tl .pt.inq { fill:var(--blue); }
.tl .lab.inq { fill:var(--blue); }
.strip .month { fill:var(--plaster); stroke:var(--ink); stroke-width:1.5; }
.strip .gap { fill:var(--gold); stroke:var(--ink); }
.strip .gaplab { font-size:12px; font-style:italic; fill:var(--ink-soft); }
.strip .lab.hit { font-weight:600; }

.unit svg { width:100%; height:auto; display:block; }
.unit .k { font:600 12px/1.3 var(--body); fill:var(--night-soft); }
.unit .k.gold { fill:var(--candle); }
.cone { fill:#8f7565; } .cone.magic { fill:var(--candle); } .cone.range { fill:none; stroke:#a88f7d; stroke-width:.9; }
.stake { --sp:#a3171f; --sf:#d8352a; --so:#f7f0e0; --sw:1.3px; } .stake.open { --sp:none; --sf:none; --so:#f08a8a; --sw:1.5px; }

.cabinet .drawers { display:grid; gap:14px; }
.dgroup p { margin:4px 0 0; font-size:14px; color:var(--ink-soft); }
.drow { display:flex; flex-wrap:wrap; gap:8px; }
.drawer { flex:1 1 90px; min-width:0; background:#6b4a2b; color:#f7f0e0; border:3px solid #d8b45a; border-radius:3px; padding:8px 8px 7px; font-size:14px; line-height:1.3; }
.drawer b { display:block; font-weight:600; }
.drawer small { display:block; font-size:12px; opacity:.92; }
.drawer.synth { background:repeating-linear-gradient(135deg, #6b4a2b 0 7px, #82603d 7px 14px); }
.drawer.empty { background:transparent; color:var(--ink); border-style:dashed; border-color:var(--ink-soft); }

.route svg { width:100%; height:auto; display:block; }
.route .sea { fill:#dfe8ef; } .route .land { fill:#e8d9b5; stroke:#9c8970; stroke-width:1; } .route .island { fill:var(--gold); stroke:var(--ink); stroke-width:1.2; }
.route .r1 { fill:none; stroke:var(--ink); stroke-width:2.2; stroke-linecap:round; } .route .r2 { fill:none; stroke:var(--blue); stroke-width:2.2; stroke-dasharray:6 5; stroke-linecap:round; }
.route .cp { fill:var(--ink); stroke:#dfe8ef; stroke-width:1.2; } .route .ml { font:600 12px var(--body); fill:var(--ink); paint-order:stroke; stroke:#dfe8ef; stroke-width:3px; stroke-linejoin:round; }
.route .leg { font:11.5px var(--body); fill:var(--ink); } .route .nts { font:italic 11px var(--body); fill:var(--ink-soft); }

.small { font-size:14px; color:var(--ink-soft); }
ul.src { font-size:14px; line-height:1.45; padding-left:18px; }
ul.src li { margin-bottom:5px; overflow-wrap:anywhere; }

@media (min-width: 900px) {
  .show { grid-template-columns:minmax(0, 1fr) minmax(0, 1fr); }
  .stagewrap { height:100vh; min-height:0; }
  .sec { padding:56px 48px; }
  .card { padding:28px 30px; }
  h1 { font-size:58px; } h2 { font-size:44px; } .herotitle { font-size:48px; }
  .oncap { font-size:12px; }
}
@media print {
  .stagewrap, .skip, .glosspop, .cabpop, .zoom { display:none !important; }
  body { background:#fff; font-size:11pt; }
  .show { display:block; }
  .sec, .sec.night { background:#fff; color:#000; padding:8pt 0; break-inside:auto; }
  .card, .night .card { box-shadow:none; background:#fff; color:#000; max-width:none; }
  .night .myth, .night .myth-sm { background:#fff; color:#000; }
  .night .unit .k, .night figcaption { fill:#000; color:#000; }
  .cone.magic { fill:#b07a00; }
  .stake.open { --so:#a3171f; }
}
@media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<a class="skip" href="#text">Skip the stage, go to the text</a>
<div class="show">
  <div class="stagewrap">
    <div class="stage" aria-hidden="true"><canvas id="stage"></canvas></div>
    <div class="stagebar">
      <span class="oncap" id="oncap"></span>
      <button type="button" class="cabbtn" id="cabbtn" aria-expanded="false" aria-controls="cabpop">Relic cabinet · <span id="cabn">0</span> of <span id="cabt">0</span></button>
    </div>
  </div>
  <main class="text" id="text">
{{BODY}}
  </main>
</div>
<div class="cabpop" id="cabpop" role="dialog" aria-label="The relic cabinet" hidden>
  <div class="cabpop-head">
    <p class="cabh">The relic cabinet</p>
    <button type="button" class="cabclose" id="cabclose" aria-label="Close the relic cabinet">×</button>
  </div>
  <p class="cabi">Each act with a saint’s relic adds a drawer here. Click any photo or name to zoom in and see the full source.</p>
  <ol id="cablist"></ol>
  <p id="cabnote"></p>
</div>
<div class="glosspop" id="glosspop" role="tooltip" hidden></div>
<div class="glosspop artpop" id="artpop" aria-hidden="true" hidden></div>
<div class="zoom" id="zoom" role="dialog" aria-modal="true" aria-label="Picture, up close" hidden>
  <button type="button" class="zclose" id="zclose" aria-label="Close the picture">×</button>
  <figure><img id="zimg" alt=""><figcaption id="zcap"></figcaption></figure>
</div>
<script>
const DATA = {{DATA}};
// ---------- images ----------
const IM = {};
for (const [k, src] of Object.entries(DATA.imgs)) { const im = new Image(); im.src = src; IM[k] = im; im.onload = () => draw(); }

// ---------- cut-paper helpers (from the approved stills) ----------
const RIM = '#f7f0e0', SHADOW = 'rgba(30,12,0,.3)';
function cut(c, path, fill, rim = 11, dx = 7, dy = 10) {
  c.save(); c.translate(dx, dy); path(c); c.fillStyle = SHADOW; c.fill(); c.lineWidth = rim; c.strokeStyle = SHADOW; c.lineJoin = 'round'; c.stroke(); c.restore();
  path(c); c.lineJoin = 'round'; c.lineWidth = rim; c.strokeStyle = RIM; c.stroke(); c.fillStyle = fill; c.fill();
}
const P = (fn) => (c) => { c.beginPath(); fn(c); c.closePath(); };
const circ = (x, y, r) => P((c) => c.arc(x, y, r, 0, Math.PI * 2));
function tiles(c, W, H, sz) {
  c.fillStyle = '#efe4c8'; c.fillRect(0, 0, W, H);
  for (let y = 0; y < H; y += sz) for (let x = 0; x < W; x += sz) {
    const m = sz / 2, r = sz * 0.16;
    c.fillStyle = ((x + y) / sz) % 2 ? '#1d4f8a' : '#e3a82f';
    c.beginPath(); for (let k = 0; k < 4; k++) { const a = k * Math.PI / 2; c.moveTo(x + m, y + m); c.arc(x + m + Math.cos(a) * sz * .22, y + m + Math.sin(a) * sz * .22, r, 0, 7); } c.fill();
    c.fillStyle = '#2f6b45'; c.beginPath(); c.moveTo(x + m, y + m - sz * .16); c.lineTo(x + m + sz * .16, y + m); c.lineTo(x + m, y + m + sz * .16); c.lineTo(x + m - sz * .16, y + m); c.fill();
    c.strokeStyle = 'rgba(29,79,138,.3)'; c.lineWidth = 1.5; c.strokeRect(x, y, sz, sz);
  }
}
function proscenium(c, L, T, R, B, floorY) {
  c.fillStyle = '#2a0f12'; c.beginPath(); c.moveTo(L, B); c.lineTo(L, T + 60); c.quadraticCurveTo((L + R) / 2, T - 60, R, T + 60); c.lineTo(R, B); c.fill();
  const g = c.createRadialGradient((L + R) / 2, floorY - 80, 20, (L + R) / 2, floorY - 80, (R - L) * .7); g.addColorStop(0, 'rgba(255,200,120,.38)'); g.addColorStop(1, 'rgba(255,200,120,0)'); c.fillStyle = g; c.fillRect(L, T - 60, R - L, B - T + 60);
}

  pop.style.left = Math.max(12, Math.min(innerWidth - pw - 12, r.left + scrollX)) + 'px';

  g.setAttribute('aria-describedby', 'glosspop');
});
addEventListener('scroll', () => {
  if (!openG) return;
  if (Math.abs(scrollY - openGY) > 48 || (innerWidth < 900 && stageWrap && openG.getBoundingClientRect().top < stageWrap.getBoundingClientRect().bottom)) closeG();
}, { passive: true });
addEventListener('beforeprint', () => document.querySelectorAll('details').forEach((d) => (d.open = true)));

// ---------- picture credits on the stage ----------
const art = document.getElementById('artpop'); let artK = null;
function hitAt(x, y) { for (let i = HITS.length - 1; i >= 0; i--) { const h = HITS[i]; if (x >= h.x0 && x <= h.x1 && y >= h.y0 && y <= h.y1) return h; } return null; }
function showArt(h, cx, cy) {
  if (artK !== h.k) {
    artK = h.k;
    if (h.k === 'ui:cabinet') {
      art.innerHTML = '<b>The relic cabinet (' + cabN + ' of ' + DATA.cab.length + ')</b> · Click to open drawers and inspect relic photos.';
    } else {
      art.innerHTML = '<b>' + (DATA.names[h.k] || '') + '</b> · ' + (DATA.credits[h.k] || '') + (DATA.zoom[h.k] ? ' <i>Click to see it up close.</i>' : '');
    }
  }
  art.hidden = false;
  const pw = art.offsetWidth, ph = art.offsetHeight;
  art.style.left = Math.max(8, Math.min(innerWidth - pw - 8, cx + 14)) + 'px';
  art.style.top = (cy + 18 + ph > innerHeight - 8 ? Math.max(8, cy - ph - 12) : cy + 18) + 'px';
}
function hideArt() { art.hidden = true; artK = null; cv.style.cursor = ''; }
const zoom = document.getElementById('zoom'), zimg = document.getElementById('zimg'), zcap = document.getElementById('zcap'), zclose = document.getElementById('zclose');
let zBack = null;
function openZoom(k) {
  if (!DATA.zoom[k]) return; closeG(); hideArt(); zBack = document.activeElement;
  zimg.onerror = () => { const fb = DATA.imgs[k] || (DATA.thumbs && DATA.thumbs[k]); if (fb && zimg.src !== fb) zimg.src = fb; };
  zimg.src = DATA.zoom[k]; zimg.alt = DATA.names[k] || ''; zcap.innerHTML = '<b>' + (DATA.names[k] || '') + '</b> · ' + (DATA.credits[k] || '');
  zoom.classList.remove('big'); zoom.hidden = false; zclose.focus();
}
function closeZoom() { zoom.hidden = true; zoom.classList.remove('big'); zimg.onerror = null; zimg.removeAttribute('src'); if (zBack && zBack.focus) zBack.focus(); }
zclose.addEventListener('click', closeZoom);
zoom.addEventListener('click', (e) => { if (e.target === zimg) zoom.classList.toggle('big'); else if (e.target === zoom) closeZoom(); });
zoom.addEventListener('keydown', (e) => { if (e.key === 'Tab') { e.preventDefault(); zclose.focus(); } });
document.addEventListener('click', (e) => { const b = e.target.closest('[data-z]'); if (b) openZoom(b.dataset.z); });
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (!zoom.hidden) { closeZoom(); return; }
  if (!cabpop.hidden) { closeCab(); return; }
  closeG(); hideArt();
});
cv.addEventListener('pointermove', (e) => {
  if (e.pointerType !== 'mouse') return;
  const h = hitAt(e.offsetX, e.offsetY);
  cv.style.cursor = h ? (h.k === 'ui:cabinet' ? 'pointer' : (DATA.zoom[h.k] ? 'zoom-in' : 'help')) : '';
  if (h) showArt(h, e.clientX, e.clientY); else hideArt();
});
cv.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') hideArt(); });
cv.addEventListener('click', (e) => {
  const h = hitAt(e.offsetX, e.offsetY);
  closeG();
  if (h && h.k === 'ui:cabinet') { toggleCab(); e.stopPropagation(); return; }
  closeCab();
  if (h && DATA.zoom[h.k]) { openZoom(h.k); e.stopPropagation(); return; }
  if (h && (art.hidden || artK !== h.k)) { showArt(h, e.clientX, e.clientY); e.stopPropagation(); } else hideArt();
});
document.addEventListener('click', (e) => { if (e.target !== cv) hideArt(); });
addEventListener('scroll', () => { if (!art.hidden) hideArt(); }, { passive: true });

addEventListener('resize', resize); resize(); setCast(0); caption(0); pickScene();
if (document.fonts) document.fonts.ready.then(draw);
if (reduced) { draw(); setInterval(draw, 400); } else requestAnimationFrame(loop);
</script>
</body>
