<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#D8D3C2"/><g transform="translate(60,50)"><rect x="-12" y="-12" width="414" height="824" rx="46" fill="#000"/><clipPath id="c60"><rect width="390" height="800" rx="36"/></clipPath><g clip-path="url(#c60)"><rect width="390" height="800" fill="#E6E2D3"/><rect x="0" y="0" width="390" height="92" fill="#C9C2A8"/><text x="24" y="56" font-family="'Courier New',Courier,monospace" font-size="22" font-weight="700" fill="#1F2328" text-anchor="start" >CASE FILE № 1520-A</text><text x="24" y="150" font-family="'Courier New',Courier,monospace" font-size="15" font-weight="700" fill="#5A5F66" text-anchor="start" >SUBJECT:</text><text x="24" y="200" font-family="'Courier New',Courier,monospace" font-size="40" font-weight="700" fill="#1F2328" text-anchor="start" >THE POMEWAWA</text><text x="24" y="260" font-family="'Courier New',Courier,monospace" font-size="15" font-weight="700" fill="#5A5F66" text-anchor="start" >Known aliases:</text><text x="24" y="288" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="400" fill="#1F2328" text-anchor="start" >Techichi (alleged)</text><text x="24" y="340" font-family="'Courier New',Courier,monospace" font-size="15" font-weight="700" fill="#5A5F66" text-anchor="start" >Height:</text><text x="24" y="368" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="400" fill="#1F2328" text-anchor="start" >shin-level</text><text x="24" y="420" font-family="'Courier New',Courier,monospace" font-size="15" font-weight="700" fill="#5A5F66" text-anchor="start" >Ancestry:</text><text x="24" y="448" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="400" fill="#1F2328" text-anchor="start" >ancient Mexican dogs,</text><text x="24" y="470" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="400" fill="#1F2328" text-anchor="start" >mother's side (mtDNA)</text><g transform="translate(195.0,600) rotate(-10)"><rect x="-150" y="-40" width="300" height="80" fill="none" stroke="#B3261E" stroke-width="4"/><text x="0" y="12" font-family="'Courier New',Courier,monospace" font-size="30" font-weight="700" fill="#B3261E" text-anchor="middle" >SMALL. ARMED.</text></g></g></g><g transform="translate(500,50)"><rect x="-12" y="-12" width="414" height="824" rx="46" fill="#000"/><clipPath id="c500"><rect width="390" height="800" rx="36"/></clipPath><g clip-path="url(#c500)"><rect width="390" height="800" fill="#E6E2D3"/><text x="24" y="60" font-family="'Courier New',Courier,monospace" font-size="26" font-weight="700" fill="#1F2328" text-anchor="start" >PRIOR RECORD</text><line x1="24" y1="76" x2="366" y2="76" stroke="#1F2328"/><text x="24" y="130" font-family="'Courier New',Courier,monospace" font-size="18" font-weight="700" fill="#B3261E" text-anchor="start" >1520</text><text x="100" y="130" font-family="'Courier New',Courier,monospace" font-size="15" font-weight="400" fill="#1F2328" text-anchor="start" >Sold as food, Aztec market.</text><text x="100" y="158" font-family="'Courier New',Courier,monospace" font-size="12" font-weight="400" fill="#5A5F66" text-anchor="start" >Cortés, Second Letter</text><text x="24" y="250" font-family="'Courier New',Courier,monospace" font-size="18" font-weight="700" fill="#B3261E" text-anchor="start" >2008</text><text x="100" y="250" font-family="'Courier New',Courier,monospace" font-size="15" font-weight="400" fill="#1F2328" text-anchor="start" >Top tier for biting, or trying</text><text x="100" y="272" font-family="'Courier New',Courier,monospace" font-size="15" font-weight="400" fill="#1F2328" text-anchor="start" >to, with strangers.</text><text x="100" y="300" font-family="'Courier New',Courier,monospace" font-size="12" font-weight="400" fill="#5A5F66" text-anchor="start" >Duffy et al., owner survey</text><text x="24" y="370" font-family="'Courier New',Courier,monospace" font-size="18" font-weight="700" fill="#B3261E" text-anchor="start" >2013</text><text x="100" y="370" font-family="'Courier New',Courier,monospace" font-size="15" font-weight="400" fill="#1F2328" text-anchor="start" >Shorter breed = more snapping,</text><text x="100" y="392" font-family="'Courier New',Courier,monospace" font-size="15" font-weight="400" fill="#1F2328" text-anchor="start" >barking. 8,301 dogs, 49 breeds.</text><text x="100" y="420" font-family="'Courier New',Courier,monospace" font-size="12" font-weight="400" fill="#5A5F66" text-anchor="start" >McGreevy et al.</text><text x="24" y="490" font-family="'Courier New',Courier,monospace" font-size="18" font-weight="700" fill="#B3261E" text-anchor="start" >2024</text><text x="100" y="490" font-family="'Courier New',Courier,monospace" font-size="15" font-weight="400" fill="#1F2328" text-anchor="start" >Outlives a Cane Corso:</text><text x="100" y="512" font-family="'Courier New',Courier,monospace" font-size="15" font-weight="400" fill="#1F2328" text-anchor="start" >11.8 years vs 8.1.</text><text x="100" y="540" font-family="'Courier New',Courier,monospace" font-size="12" font-weight="400" fill="#5A5F66" text-anchor="start" >McMillan et al., 584,734 dogs</text><text x="24" y="640" font-family="'Courier New',Courier,monospace" font-size="15" font-weight="700" fill="#5A5F66" text-anchor="start" >EVIDENCE REJECTED:</text><text x="24" y="668" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="400" fill="#1F2328" text-anchor="start" >“743 PSI Kangal bite”</text><line x1="20" y1="663" x2="250" y2="663" stroke="#B3261E" stroke-width="3"/><text x="24" y="694" font-family="'Courier New',Courier,monospace" font-size="14" font-weight="400" fill="#B3261E" text-anchor="start" >never measured. Internet lore.</text></g></g><text x="980" y="200" font-family="Helvetica,Arial,sans-serif" font-size="52" font-weight="800" fill="#222">C. Case file</text><text x="980" y="290" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#333">Police rap sheet on</text><text x="980" y="342" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#333">a tiny suspect.</text><text x="980" y="394" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#333">Priors, aliases, evidence.</text><text x="980" y="446" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#333">Deadpan, funny, nosy.</text><text x="980" y="498" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#333"></text><text x="980" y="550" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#333">Avoids: sappy dog-mom.</text></svg>