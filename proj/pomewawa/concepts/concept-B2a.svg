<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#E4DBCA"/><g transform="translate(60,50)"><rect x="-12" y="-12" width="414" height="824" rx="46" fill="#000"/><clipPath id="c60"><rect width="390" height="800" rx="36"/></clipPath><g clip-path="url(#c60)"><rect width="390" height="800" fill="#F3ECDD"/><text x="26" y="62" font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="900" fill="#C2350F" text-anchor="start" letter-spacing="2">PLATE I · DRAWN TO SCALE</text><text x="26" y="125" font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="54" font-weight="900" fill="#211C17" text-anchor="start" letter-spacing="-1">TINY.</text><text x="26" y="180" font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="54" font-weight="900" fill="#211C17" text-anchor="start" letter-spacing="-1">ANCIENT.</text><text x="26" y="235" font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="54" font-weight="900" fill="#C2350F" text-anchor="start" letter-spacing="-1">UNBOTHERED.</text><text x="26" y="292" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#5F5649" text-anchor="start" >The Pomewawa: Pomeranian × Chihuahua.</text><text x="26" y="314" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#5F5649" text-anchor="start" >Every number checked.</text><line x1="26" y1="700" x2="364" y2="700" stroke="#D8CDB8" stroke-width="1"/><text x="26" y="696" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#5F5649" text-anchor="start" >0</text><line x1="26" y1="630" x2="364" y2="630" stroke="#D8CDB8" stroke-width="1"/><text x="26" y="626" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#5F5649" text-anchor="start" >10</text><line x1="26" y1="560" x2="364" y2="560" stroke="#D8CDB8" stroke-width="1"/><text x="26" y="556" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#5F5649" text-anchor="start" >20</text><line x1="26" y1="490" x2="364" y2="490" stroke="#D8CDB8" stroke-width="1"/><text x="26" y="486" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#5F5649" text-anchor="start" >30</text><line x1="26" y1="420" x2="364" y2="420" stroke="#D8CDB8" stroke-width="1"/><text x="26" y="416" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#5F5649" text-anchor="start" >40</text><line x1="26" y1="350" x2="364" y2="350" stroke="#D8CDB8" stroke-width="1"/><text x="26" y="346" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#5F5649" text-anchor="start" >50</text><rect x="80" y="357" width="110" height="343" fill="none" stroke="#211C17" stroke-width="2"/><text x="80" y="347" font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="900" fill="#211C17" text-anchor="start" >49 cm</text><text x="80" y="724" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#211C17" text-anchor="start" >Wolfspitz</text><text x="80" y="743" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5F5649" text-anchor="start" >the cousin</text><rect x="230" y="546" width="110" height="154" fill="#211C17" stroke="#211C17" stroke-width="2"/><text x="230" y="536" font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="900" fill="#C2350F" text-anchor="start" >22 cm</text><text x="230" y="724" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#211C17" text-anchor="start" >Pomeranian</text><text x="26" y="772" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#5F5649" text-anchor="start" >Height at the shoulder (cm), FCI standard 97. Same breed standard.</text></g></g><g transform="translate(500,50)"><rect x="-12" y="-12" width="414" height="824" rx="46" fill="#000"/><clipPath id="c500"><rect width="390" height="800" rx="36"/></clipPath><g clip-path="url(#c500)"><rect width="390" height="800" fill="#F3ECDD"/><text x="26" y="62" font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="900" fill="#C2350F" text-anchor="start" letter-spacing="2">PLATE IV · HOW LONG THEY LAST</text><text x="26" y="120" font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="44" font-weight="900" fill="#211C17" text-anchor="start" >OUTLIVES THE</text><text x="26" y="166" font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="44" font-weight="900" fill="#211C17" text-anchor="start" >BIG GUY.</text><text x="26" y="196" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#5F5649" text-anchor="start" >Typical age at death, UK, 584,734 dogs (2024).</text><rect x="26" y="240" width="259.6" height="40" fill="#C2350F"/><text x="293.6" y="270" font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="900" fill="#C2350F" text-anchor="start" >11.8</text><text x="26" y="300" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#211C17" text-anchor="start" >Chihuahua</text><rect x="26" y="318" width="178.2" height="40" fill="#5F5649"/><text x="212.2" y="348" font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="900" fill="#211C17" text-anchor="start" >8.1</text><text x="26" y="378" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#211C17" text-anchor="start" >Cane Corso</text><text x="26" y="404" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#5F5649" text-anchor="start" >0 years at the left edge.</text><text x="26" y="440" font-family="Georgia,'Times New Roman',serif" font-size="15" font-weight="400" fill="#211C17" text-anchor="start" font-style="italic">(The Corso does win the fight. We checked.)</text><g transform="translate(195.0,545) rotate(-5)"><rect x="-150.0" y="-50" width="300" height="96" fill="none" stroke="#C2350F" stroke-width="4"/><text x="0" y="-20" font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="900" fill="#C2350F" text-anchor="middle" letter-spacing="3">MYTH CHECK</text><text x="0" y="6" font-family="Georgia,'Times New Roman',serif" font-size="15" font-weight="400" fill="#211C17" text-anchor="middle" >“Aztec dogs were hot-water bottles”</text><text x="0" y="32" font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="900" fill="#C2350F" text-anchor="middle" >NO OLD RECORD BACKS IT</text></g><line x1="26" y1="630" x2="364" y2="630" stroke="#D8CDB8" stroke-width="1"/><text x="26" y="690" font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="54" font-weight="900" fill="#C2350F" text-anchor="start" >2 of 3</text><text x="205" y="668" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#211C17" text-anchor="start" >dogs that survived</text><text x="205" y="690" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#211C17" text-anchor="start" >the Titanic were</text><text x="205" y="712" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#211C17" text-anchor="start" >Pomeranians.</text><text x="26" y="745" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#5F5649" text-anchor="start" >1912 · Liverpool Museums, Encyclopedia Titanica</text></g></g><text x="980" y="200" font-family="Helvetica,Arial,sans-serif" font-size="52" font-weight="800" fill="#222">B+ Paper</text><text x="980" y="290" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#333">Field-guide paper,</text><text x="980" y="342" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#333">fight-poster type.</text><text x="980" y="394" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#333">Hot red-orange accent.</text><text x="980" y="446" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#333">Prints cleanly.</text></svg>