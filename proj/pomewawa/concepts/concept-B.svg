<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#E3DACA"/><g transform="translate(60,50)"><rect x="-12" y="-12" width="414" height="824" rx="46" fill="#000"/><clipPath id="c60"><rect width="390" height="800" rx="36"/></clipPath><g clip-path="url(#c60)"><rect width="390" height="800" fill="#F2EBDD"/><text x="28" y="64" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#8C2F1B" text-anchor="start" letter-spacing="3">PLATE I</text><text x="28" y="120" font-family="Georgia,'Times New Roman',serif" font-size="44" font-weight="700" fill="#2A2520" text-anchor="start" >A big dog,</text><text x="28" y="168" font-family="Georgia,'Times New Roman',serif" font-size="44" font-weight="700" fill="#2A2520" text-anchor="start" font-style="italic">shrunk on purpose.</text><text x="28" y="210" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#6E655A" text-anchor="start" >Same breed standard, two sizes. Drawn to scale.</text><line x1="28" y1="690" x2="44" y2="690" stroke="#2A2520" stroke-width="1.5"/><text x="50" y="695" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#6E655A" text-anchor="start" >0 cm</text><line x1="28" y1="610" x2="44" y2="610" stroke="#2A2520" stroke-width="1.5"/><text x="50" y="615" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#6E655A" text-anchor="start" >10 cm</text><line x1="28" y1="530" x2="44" y2="530" stroke="#2A2520" stroke-width="1.5"/><text x="50" y="535" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#6E655A" text-anchor="start" >20 cm</text><line x1="28" y1="450" x2="44" y2="450" stroke="#2A2520" stroke-width="1.5"/><text x="50" y="455" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#6E655A" text-anchor="start" >30 cm</text><line x1="28" y1="370" x2="44" y2="370" stroke="#2A2520" stroke-width="1.5"/><text x="50" y="375" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#6E655A" text-anchor="start" >40 cm</text><line x1="28" y1="290" x2="44" y2="290" stroke="#2A2520" stroke-width="1.5"/><text x="50" y="295" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#6E655A" text-anchor="start" >50 cm</text><line x1="36" y1="690" x2="36" y2="290" stroke="#2A2520" stroke-width="1.5"/><rect x="130" y="298" width="100" height="392" fill="none" stroke="#2A2520" stroke-width="2" stroke-dasharray="4 4"/><line x1="130" y1="298" x2="230" y2="298" stroke="#8C2F1B" stroke-width="3"/><text x="130" y="286" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#8C2F1B" text-anchor="start" >49 cm</text><text x="130" y="718" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#2A2520" text-anchor="start" >Wolfspitz</text><text x="130" y="738" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#6E655A" text-anchor="start" >the cousin</text><rect x="260" y="514" width="100" height="176" fill="none" stroke="#2A2520" stroke-width="2" stroke-dasharray="4 4"/><line x1="260" y1="514" x2="360" y2="514" stroke="#8C2F1B" stroke-width="3"/><text x="260" y="502" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#8C2F1B" text-anchor="start" >22 cm</text><text x="260" y="718" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#2A2520" text-anchor="start" >Pomeranian</text><text x="260" y="738" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#6E655A" text-anchor="start" ></text><line x1="20" y1="690" x2="370" y2="690" stroke="#2A2520" stroke-width="1"/><text x="28" y="770" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#6E655A" text-anchor="start" >Height at the shoulder, FCI standard 97.</text></g></g><g transform="translate(500,50)"><rect x="-12" y="-12" width="414" height="824" rx="46" fill="#000"/><clipPath id="c500"><rect width="390" height="800" rx="36"/></clipPath><g clip-path="url(#c500)"><rect width="390" height="800" fill="#F2EBDD"/><text x="28" y="64" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#8C2F1B" text-anchor="start" letter-spacing="3">PLATE II</text><text x="28" y="112" font-family="Georgia,'Times New Roman',serif" font-size="34" font-weight="700" fill="#2A2520" text-anchor="start" >A short history</text><line x1="98" y1="150" x2="98" y2="590" stroke="#2A2520" stroke-width="1.5"/><circle cx="98" cy="169" r="6" fill="#8C2F1B"/><text x="84" y="175" font-family="Georgia,'Times New Roman',serif" font-size="17" font-weight="700" fill="#2A2520" text-anchor="end" >1520</text><text x="116" y="175" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A2520" text-anchor="start" >Cortés sees “little dogs” sold</text><text x="116" y="196" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A2520" text-anchor="start" >for eating in the Aztec</text><text x="116" y="217" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A2520" text-anchor="start" >market.</text><circle cx="98" cy="257" r="6" fill="#8C2F1B"/><text x="84" y="263" font-family="Georgia,'Times New Roman',serif" font-size="17" font-weight="700" fill="#2A2520" text-anchor="end" >c.1777</text><text x="116" y="263" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A2520" text-anchor="start" >Gainsborough paints a</text><text x="116" y="284" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A2520" text-anchor="start" >Pomeranian and her puppy.</text><circle cx="98" cy="345" r="6" fill="#8C2F1B"/><text x="84" y="351" font-family="Georgia,'Times New Roman',serif" font-size="17" font-weight="700" fill="#2A2520" text-anchor="end" >1900</text><text x="116" y="351" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A2520" text-anchor="start" >The AKC recognizes the</text><text x="116" y="372" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A2520" text-anchor="start" >Pomeranian.</text><circle cx="98" cy="433" r="6" fill="#8C2F1B"/><text x="84" y="439" font-family="Georgia,'Times New Roman',serif" font-size="17" font-weight="700" fill="#2A2520" text-anchor="end" >1904</text><text x="116" y="439" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A2520" text-anchor="start" >…and the Chihuahua. First one</text><text x="116" y="460" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A2520" text-anchor="start" >registered: “Midget.”</text><circle cx="98" cy="521" r="6" fill="#8C2F1B"/><text x="84" y="527" font-family="Georgia,'Times New Roman',serif" font-size="17" font-weight="700" fill="#2A2520" text-anchor="end" >1912</text><text x="116" y="527" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A2520" text-anchor="start" >Titanic sinks. 3 dogs survive.</text><text x="116" y="548" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A2520" text-anchor="start" >2 are Pomeranians.</text><g transform="translate(195.0,690) rotate(-4)"><rect x="-165" y="-48" width="330" height="92" fill="none" stroke="#8C2F1B" stroke-width="3"/><text x="0" y="-18" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#8C2F1B" text-anchor="middle" letter-spacing="3">MYTH CHECK</text><text x="0" y="8" font-family="Georgia,'Times New Roman',serif" font-size="15" font-weight="400" fill="#2A2520" text-anchor="middle" >“Aztec dogs were hot-water bottles”</text><text x="0" y="32" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#8C2F1B" text-anchor="middle" >No old record backs it.</text></g></g></g><text x="980" y="200" font-family="Helvetica,Arial,sans-serif" font-size="52" font-weight="800" fill="#222">B. Field guide</text><text x="980" y="290" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#333">Old naturalist plates</text><text x="980" y="342" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#333">with modern data.</text><text x="980" y="394" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#333">Everything to scale.</text><text x="980" y="446" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#333">Dry, smart, curious.</text><text x="980" y="498" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#333"></text><text x="980" y="550" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#333">Avoids: meme noise.</text></svg>