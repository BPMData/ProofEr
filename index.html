<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProofEr</title>
<meta name="description" content="Better, better-sourced infographics to share with the world.">
<style>
  :root { --bg:#f5f3ee; --ink:#1d1d1f; --dim:#5c5c62; --line:#d8d4cb; --accent:#7a1f2b; --card:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151517; --ink:#f1efe9; --dim:#a5a5ab; --line:#333338; --accent:#e38b97; --card:#1f1f23; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:18px/1.5 Georgia, "Times New Roman", serif; }
  main { max-width:880px; margin:0 auto; padding:56px 16px 64px; }
  .kicker { font:600 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); }
  h1 { font-size:clamp(40px, 8vw, 72px); line-height:1.05; margin:.2em 0 .3em; }
  h1 span { color:var(--accent); }
  .lede { font-size:21px; max-width:36em; margin:0 0 40px; }
  h2 { font:700 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); border-top:1px solid var(--line); padding-top:18px; }
  .pieces { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; color:inherit; text-decoration:none; }
  .card:hover { border-color:var(--accent); }
  .empty { color:var(--dim); font-style:italic; }
  footer { margin-top:56px; font:14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--dim); }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <div class="kicker">ProofEr · beta</div>
  <h1>Proof<span>Er</span></h1>
  <p class="lede">Better, better-sourced infographics to share with the world. Every number on every page traces back
  to sources you can check.</p>
  <h2>Infographics</h2>
  <div class="pieces">
    <!-- One card per published piece:
    <a class="card" href="pieces/NAME.html"><strong>Title</strong><br><span class="kicker">Topic · date</span></a> -->
    <p class="empty">The first piece is on its way.</p>
  </div>
  <footer>
    Made with <a href="https://github.com/BPMData/ProofEr">ProofEr</a> · code under the GNU AGPLv3 · pieces belong to
    the people who made them.
  </footer>
</main>
</body>
</html>
